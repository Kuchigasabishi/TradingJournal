[pytest]
testpaths = tests
norecursedirs = _canary
addopts = -ra --strict-markers
markers =
    p0: phase 0, harness proof
    p1: phase 1, FastAPI skeleton and journal API
    p2: phase 2, Expo web UI
    p3: phase 3, data connectors
    p4: phase 4, E2E journeys and hardening
    deployment: runs against the production definition (docker-compose.yml alone) in the second stack of scripts/verify.py --backend compose, never in the main one
    expo_app: needs the Expo app at /, which the compose image always serves; scripts/verify.py runs these only on the compose backend (natively the Phase 2 tests cover the app)
    stub_page: needs the Phase 0 stub page, which the Expo app replaces from Phase 2 on; verify.py leaves these out from then
    after_restart: runs in a second pass, after verify.py has stopped and restarted the server on the same database
    allow_console_errors(*patterns, reason): downgrade matching browser errors to warnings for one test; the reason is mandatory
